      createHTML: (s) => s, // avoid stack overflow
    });
    window.trustedTypes.createPolicy('default', {
      createHTML: (input, type, sink) => {
        let processedInput = input;
        if (/srcdoc\s*=/i.test(processedInput)) {
          const doc = new DOMParser().parseFromString(innerTT.createHTML(processedInput), 'text/html');
          doc.querySelectorAll('iframe[srcdoc]').forEach((el) => el.removeAttribute('srcdoc'));

  // state (scripts/target-profile.js, same localStorage entry); a signed-in customer whose
  // purchase state is not known yet gets the decision from scripts.js after one orders check.
  // No body hiding. aem.page / aem.live are public suffixes: the mbox cookie goes on the host.
  (() => {

    if (/\.(stage-ue|ue)\.da\.live$/.test(host)) return;

      cookieDomain: host,
      bodyHidingEnabled: false,
      pageLoadEnabled: !token || known,
